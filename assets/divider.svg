<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 26" width="900" height="26" role="presentation">
  <style>
    @keyframes along { from { transform: translateX(-30px); } to { transform: translateX(930px); } }
    @keyframes bob { 0%, 100% { transform: translateY(-3px) rotate(-14deg); } 50% { transform: translateY(4px) rotate(16deg); } }
    .along { animation: along 16s linear infinite; }
    .leaf { transform-origin: 0 13px; animation: bob 3.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .along, .leaf { animation: none; } .along { display: none; } }
  </style>
  <path d="M60 14C200 9 330 18 450 13S710 9 840 14" fill="none" stroke="#8fae7e" stroke-opacity=".65" stroke-width="1.5" stroke-linecap="round"/>
  <g class="along"><g class="leaf"><path d="M-9 13C-4 5 6 5 10 13C5 20-5 20-9 13Z" fill="#7da35f"/><path d="M-9 13H8" stroke="#55793f" stroke-width=".8"/></g></g>
</svg>
