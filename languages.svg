<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Most used languages">
  <title>Most used languages</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf9ee"/><stop offset="1" stop-color="#f3ecd8"/></linearGradient></defs>
  <style>
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.8s cubic-bezier(.2, .8, .2, 1) backwards; }
    .fade { animation: fade 1.2s ease-out backwards; }
    @media (prefers-reduced-motion: reduce) { .bar, .fade { animation: none; } }
  </style>
  <rect width="400" height="240" rx="14" fill="url(#g)"/>
  <rect x=".75" y=".75" width="398.5" height="238.5" rx="13.5" fill="none" stroke="#d8cdaf" stroke-width="1.5"/>
  <g font-family="'Segoe UI','Noto Sans Thai','Sarabun',Tahoma,system-ui,sans-serif">
    <text x="24" y="40" fill="#2f4634" font-family="Georgia,'Noto Serif Thai','Sarabun','Leelawadee UI',Tahoma,serif" font-size="19" font-weight="700">Languages <tspan fill="#7a6a4c" font-size="14" font-weight="400">· ภาษาที่ใช้</tspan></text>
    <text x="376" y="38" text-anchor="end" fill="#a39573" font-size="11">last 3 years · 3 ปีล่าสุด</text>
    <g>
      <text x="24" y="83" fill="#44524a" font-size="14">Python</text>
      <rect x="112" y="72" width="232" height="11" rx="5.5" fill="#e8e0ca"/>
      <rect class="bar" style="animation-delay:0s" x="112" y="72" width="232.0" height="11" rx="5.5" fill="#5e8c61"/>
      <text x="376" y="83" text-anchor="end" fill="#7a6a4c" font-size="12">54%</text>
    </g>
    <g>
      <text x="24" y="116" fill="#44524a" font-size="14">JavaScript</text>
      <rect x="112" y="105" width="232" height="11" rx="5.5" fill="#e8e0ca"/>
      <rect class="bar" style="animation-delay:0.15s" x="112" y="105" width="54.8" height="11" rx="5.5" fill="#8fb26b"/>
      <text x="376" y="116" text-anchor="end" fill="#7a6a4c" font-size="12">13%</text>
    </g>
    <g>
      <text x="24" y="149" fill="#44524a" font-size="14">TypeScript</text>
      <rect x="112" y="138" width="232" height="11" rx="5.5" fill="#e8e0ca"/>
      <rect class="bar" style="animation-delay:0.3s" x="112" y="138" width="49.0" height="11" rx="5.5" fill="#d9a95f"/>
      <text x="376" y="149" text-anchor="end" fill="#7a6a4c" font-size="12">11%</text>
    </g>
    <g>
      <text x="24" y="182" fill="#44524a" font-size="14">Java</text>
      <rect x="112" y="171" width="232" height="11" rx="5.5" fill="#e8e0ca"/>
      <rect class="bar" style="animation-delay:0.44999999999999996s" x="112" y="171" width="41.0" height="11" rx="5.5" fill="#c4744a"/>
      <text x="376" y="182" text-anchor="end" fill="#7a6a4c" font-size="12">10%</text>
    </g>
    <g>
      <text x="24" y="215" fill="#44524a" font-size="14">ReScript</text>
      <rect x="112" y="204" width="232" height="11" rx="5.5" fill="#e8e0ca"/>
      <rect class="bar" style="animation-delay:0.6s" x="112" y="204" width="9.8" height="11" rx="5.5" fill="#7fa8b8"/>
      <text x="376" y="215" text-anchor="end" fill="#7a6a4c" font-size="12">2%</text>
    </g>
  </g>
</svg>
