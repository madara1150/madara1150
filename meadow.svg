    .s1 { animation-delay: -2.3s; animation-duration: 8.2s; }
    .s2 { animation-delay: -4.4s; animation-duration: 6.3s; }
    @media (prefers-reduced-motion: reduce) { .sway { animation: none; } }
  </style>
