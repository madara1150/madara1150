<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="A meadow where each clump of grass is one week of contributions from the past year">
  <title>Contribution meadow</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec7e3"/><stop offset=".75" stop-color="#fbeecd"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc66a"/><stop offset="1" stop-color="#4f8449"/></linearGradient>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .55 -.2"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="220" rx="14"/></clipPath>
  </defs>
  <style>
