    <text x="28" y="54" fill="#23506a" font-family="'Segoe UI','Noto Sans Thai','Sarabun',Tahoma,system-ui,sans-serif" font-size="12">Each clump is one week; busier weeks grow taller · หนึ่งกอคือหนึ่งสัปดาห์ ยิ่งทำมากยิ่งสูง</text>
